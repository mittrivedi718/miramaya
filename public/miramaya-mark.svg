<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="title desc">
  <title id="title">Miramaya</title>
  <desc id="desc">A serif letter M reflected through rippling water.</desc>
  <defs>
    <clipPath id="reflection"><rect x="0" y="180" width="320" height="180"/></clipPath>
    <filter id="ripple" x="-20%" y="-15%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.075" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171817" stop-opacity=".88"/>
      <stop offset="1" stop-color="#171817" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <rect width="320" height="360" fill="#f3f0e9"/>
  <text x="160" y="181" fill="#171817" font-family="Didot, 'Bodoni MT', 'Times New Roman', serif" font-size="178" font-weight="600" text-anchor="middle">M</text>
  <path d="M12 181 C48 176 72 188 108 181 S166 187 201 180 S267 187 308 181" fill="none" stroke="#171817" stroke-width="4" stroke-linecap="round"/>
  <g clip-path="url(#reflection)" filter="url(#ripple)" opacity=".94">
    <text x="160" y="-181" transform="scale(1 -1)" fill="url(#fade)" font-family="Didot, 'Bodoni MT', 'Times New Roman', serif" font-size="178" font-weight="600" text-anchor="middle">M</text>
  </g>
  <g fill="none" stroke="#171817" stroke-linecap="round" opacity=".86">
    <path d="M28 206 C69 199 92 213 127 205 S189 211 230 204 S275 208 297 205" stroke-width="3"/>
    <path d="M51 232 C85 226 107 239 140 232 S198 238 260 231" stroke-width="2.8"/>
    <path d="M66 258 C96 253 114 265 151 257 S207 264 247 257" stroke-width="2.4"/>
    <path d="M88 287 C118 280 137 291 162 286 S204 290 231 285" stroke-width="2"/>
  </g>
</svg>
